{% extends 'base.html' %}
{% block title %}Email envoyé — MyTradingJournal Pro{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="glass card-3d p-4 p-md-5 auth-card text-center">
        <i class="bi bi-envelope-check" style="font-size:2rem;color:var(--neon-green);"></i>
        <h5 class="mt-3">Email envoyé</h5>
        <p class="text-muted small">Si un compte existe avec cette adresse, un lien de réinitialisation vient d'être envoyé (voir la console du serveur en développement).</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline-glass btn-3d mt-2">Retour à la connexion</a>
    </div>
</div>
{% endblock %}
