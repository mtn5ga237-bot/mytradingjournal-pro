{% extends 'base.html' %}
{% block title %}Supprimer le trade — MyTradingJournal Pro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass card-3d p-4 text-center">
            <i class="bi bi-exclamation-triangle text-danger" style="font-size:2.5rem;"></i>
            <h5 class="mt-3">Supprimer ce trade ?</h5>
            <p class="text-muted">{{ object.paire }} — {{ object.date_ouverture|date:"d/m/Y H:i" }} — Résultat : {{ object.net_result }}</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2 mt-3">
                    <button type="submit" class="btn btn-danger-soft btn-3d"><i class="bi bi-trash me-1"></i>Supprimer</button>
                    <a href="{% url 'trades:list' %}" class="btn btn-outline-glass btn-3d">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
